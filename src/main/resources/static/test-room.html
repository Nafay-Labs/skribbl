<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin-bottom: 20px; box-shadow: 2px 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 8px 16px; border: none; border-radius: 4px; background-color: #2196F3; color: white; cursor: pointer; transition: background 0.3s; }
    button:hover { background-color: #1976D2; }
    button.join { background-color: #32c787; }
    button.join:hover { background-color: #2bbd7a; }
    #log { background-color: #f4f4f4; border: 1px solid #ddd; padding: 10px; height: 200px; overflow-y: auto; border-radius: 4px; font-family: monospace; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Room Testing Console</h1>
  
  <div class="card" id="player-card">
    <h2>1. Register Player</h2>
    <div class="form-group">
      <label for="nickname">Nickname</label>
      <input type="text" id="nickname" placeholder="Enter nickname">
    </div>
    <button onclick="registerPlayer()">Step 1: Register Player</button>
  </div>

  <div class="card hidden" id="room-card">
    <h2>2. Room Actions (Logged in as <span id="current-player-name"></span>)</h2>
    <p>Player ID: <span id="current-player-id" style="font-weight: bold;"></span></p>
    
    <div class="form-group">
      <button onclick="createRoom()">Action: Create Room</button>
    </div>
    
    <hr>
    
    <div class="form-group">
      <label for="roomIdInput">Room ID to Join</label>
      <input type="text" id="roomIdInput" placeholder="Paste Room ID here">
    </div>
    <button class="join" onclick="joinRoom()">Action: Join Room</button>
  </div>

  <div class="card">
    <h2>WebSocket Status & Logs</h2>
    <div id="status">Status: Disconnected</div>
    <div id="log"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
  <script>
    let stompClient = null;
    let playerId = null;
    let nickname = null;

    function log(message, isRaw = false) {
      const logDiv = document.getElementById('log');
      const entry = document.createElement('div');
      entry.textContent = `[${new Date().toLocaleTimeString()}] ` + (isRaw ? JSON.stringify(message, null, 2) : message);
      logDiv.appendChild(entry);
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    async function registerPlayer() {
      const name = document.getElementById('nickname').value.trim();
      if (!name) return alert("Please enter a nickname");
      
      try {
        const response = await fetch(`/api/player/register?nickname=${encodeURIComponent(name)}`, { method: 'POST' });
        const data = await response.json();
        playerId = data.playerId;
        nickname = data.nickname;
        
        document.getElementById('current-player-name').textContent = nickname;
        document.getElementById('current-player-id').textContent = playerId;
        document.getElementById('player-card').classList.add('hidden');
        document.getElementById('room-card').classList.remove('hidden');
        
        log(`Player registered: ${nickname} (${playerId})`);
        connectWebSocket();
      } catch (err) {
        log(`Error registering player: ${err}`);
      }
    }

    function connectWebSocket() {
      const socket = new SockJS('/ws');
      stompClient = Stomp.over(socket);
      
      stompClient.connect({}, (frame) => {
        document.getElementById('status').textContent = "Status: Connected";
        log("WebSocket connected!");
        
        // Subscribe to public topic by default
        stompClient.subscribe('/topic/public', (msg) => {
          log("MESSAGE (PUBLIC): " + msg.body);
        });

        // Subscribe to user-specific creation responses
        stompClient.subscribe('/user/queue/room/create', (msg) => {
          log("MESSAGE (PRIVATE/CREATE): " + msg.body);
          const response = JSON.parse(msg.body);
          if (response.content.includes("ID: ")) {
            const roomId = response.content.split("ID: ")[1];
            document.getElementById('roomIdInput').value = roomId;
          }
        });
      }, (error) => {
        document.getElementById('status').textContent = "Status: Error";
        log("WebSocket Error: " + error);
      });
    }

    function createRoom() {
      if (!stompClient || !playerId) return log("Not connected or no player registered");
      
      log(`Calling createRoom for ${playerId}...`);
      stompClient.send("/app/room/create", {}, JSON.stringify(playerId));
      
      // Wait for session attribute updates (this is hard to see without a subscription)
      log("Note: CreateRoom currently returns JOIN_GAME message to public/session topic.");
    }

    function joinRoom() {
      const roomId = document.getElementById('roomIdInput').value.trim();
      if (!roomId) return alert("Enter a Room ID");
      if (!stompClient || !playerId) return log("Not connected or no player registered");

      // Subscribe to room topic first
      const roomTopic = `/topic/room/${roomId}`;
      log(`Subscribing to ${roomTopic}...`);
      stompClient.subscribe(roomTopic, (msg) => {
        log(`MESSAGE (ROOM ${roomId}): ` + msg.body);
      });

      log(`Calling joinRoom for ${roomId} with player ${playerId}...`);
      stompClient.send(`/app/room/${roomId}/join`, {}, JSON.stringify(playerId));
    }
  </script>
</body>
</html>
